package:
  name: run
  description: An extensible-effects implementation for PureScript
  build:
    strict: true
  publish:
    version: 5.0.1
    license: MIT
    location:
      githubOwner: natefaubion
      githubRepo: purescript-run
  dependencies:
    - aff: ">=7.0.0 <9.0.0"
    - control: ">=6.0.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.0.0 <7.0.0"
    - free: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - type-equality: ">=4.0.0 <5.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
    - variant: ">=8.0.0 <9.0.0"
  test:
    main: Test.Main
    dependencies:
      - arrays: ">=7.0.0 <8.0.0"
      - console: ">=6.0.0 <7.0.0"
      - foldable-traversable: ">=6.0.0 <7.0.0"
      - identity: ">=6.0.0 <7.0.0"
      - minibench: ">=4.0.0 <5.0.0"
      - transformers: ">=6.0.0 <7.0.0"
workspace:
  buildOpts:
    censorLibraryWarnings: all
